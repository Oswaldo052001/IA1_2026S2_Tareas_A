<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario RPG - Tarea 2</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #1b1f2a;
        color: #eee;
        display: flex;
        justify-content: center;
        padding: 40px 16px;
    }
    .contenedor {
        width: 100%;
        max-width: 560px;
        background: #262c3d;
        border: 1px solid #3a4258;
        border-radius: 10px;
        padding: 28px;
    }
    h1 {
        margin-top: 0;
        font-size: 22px;
        color: #f2c14e;
    }
    p.subtitulo {
        color: #9aa3b8;
        margin-top: -6px;
        font-size: 14px;
    }
    form {
        display: flex;
        gap: 8px;
        margin: 20px 0;
    }
    input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #3a4258;
        background: #1b1f2a;
        color: #eee;
        font-size: 14px;
    }
    button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        background: #f2c14e;
        color: #1b1f2a;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { background: #d9ad3f; }
    #error { color: #ff6b6b; font-size: 14px; min-height: 18px; }
    #resultado h3 { color: #f2c14e; margin-bottom: 4px; }
    #resultado h4 { color: #9dd6ff; margin-bottom: 4px; }
    #resultado ul { margin-top: 4px; padding-left: 20px; }
    footer { margin-top: 24px; font-size: 12px; color: #5b6379; }
</style>
</head>
<body>

<div class="contenedor">
    <h1>Inventario del Aventurero (RPG)</h1>
    <p class="subtitulo">Fase 3 - Frontend | Tarea #2 - IA1</p>

    <form id="form-busqueda">
        <input type="text" id="item-input" placeholder="Ej: espada, pocion, llave..." autocomplete="off">
        <button type="submit">Buscar</button>
    </form>

    <div id="error"></div>
    <div id="resultado"></div>

    <footer>
        Oswaldo Antonio Choc Cuteres - 201901844<br>
        Backend: PySwip + Flask | Motor: SWI-Prolog
    </footer>
</div>

<script src="script.js"></script>
</body>
</html>
